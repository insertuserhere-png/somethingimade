<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f2f2f2;
            margin: 0;
            padding: 30px;
        }

        h1 {
            color: #333;
        }

        #status {
            font-size: 22px;
            font-weight: bold;
            margin: 20px;
        }

        #board {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            grid-template-rows: repeat(3, 100px);
            gap: 5px;
            justify-content: center;
            margin: 20px auto;
        }

        .cell {
            width: 100px;
            height: 100px;
            font-size: 45px;
            font-weight: bold;
            border: none;
            background-color: white;
            cursor: pointer;
            border-radius: 8px;
        }

        .cell:hover {
            background-color: #e6e6e6;
        }

        .x {
            color: #e74c3c;
        }

        .o {
            color: #3498db;
        }

        #restart {
            padding: 12px 25px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            background-color: #333;
            color: white;
            cursor: pointer;
        }

        #restart:hover {
            background-color: #555;
        }
    </style>
</head>

<body>

    <h1>Tic-Tac-Toe</h1>

    <div id="status">Player X's turn</div>

    <div id="board">
        <button class="cell" onclick="makeMove(0)"></button>
        <button class="cell" onclick="makeMove(1)"></button>
        <button class="cell" onclick="makeMove(2)"></button>

        <button class="cell" onclick="makeMove(3)"></button>
        <button class="cell" onclick="makeMove(4)"></button>
        <button class="cell" onclick="makeMove(5)"></button>

        <button class="cell" onclick="makeMove(6)"></button>
        <button class="cell" onclick="makeMove(7)"></button>
        <button class="cell" onclick="makeMove(8)"></button>
    </div>

    <button id="restart" onclick="restartGame()">Restart Game</button>

    <script>
        let board = ["", "", "", "", "", "", "", "", ""];
        let player = "X";
        let gameOver = false;

        const winningCombinations = [
            [0, 1, 2],
            [3, 4, 5],
            [6, 7, 8],
            [0, 3, 6],
            [1, 4, 7],
            [2, 5, 8],
            [0, 4, 8],
            [2, 4, 6]
        ];

        function makeMove(position) {
            if (gameOver) {
                return;
            }

            // Don't allow a player to choose an occupied spot
            if (board[position] !== "") {
                return;
            }

            board[position] = player;

            updateBoard();

            if (checkWinner()) {
                document.getElementById("status").textContent =
                    "Player " + player + " wins!";

                gameOver = true;
                return;
            }

            if (boardFull()) {
                document.getElementById("status").textContent =
                    "It's a draw!";

                gameOver = true;
                return;
            }

            // Switch players
            player = player === "X" ? "O" : "X";

            document.getElementById("status").textContent =
                "Player " + player + "'s turn";
        }

        function updateBoard() {
            const cells = document.querySelectorAll(".cell");

            for (let i = 0; i < cells.length; i++) {
                cells[i].textContent = board[i];

                cells[i].classList.remove("x", "o");

                if (board[i] === "X") {
                    cells[i].classList.add("x");
                }

                if (board[i] === "O") {
                    cells[i].classList.add("o");
                }
            }
        }

        function checkWinner() {
            for (let combination of winningCombinations) {
                const a = combination[0];
                const b = combination[1];
                const c = combination[2];

                if (
                    board[a] !== "" &&
                    board[a] === board[b] &&
                    board[b] === board[c]
                ) {
                    return true;
                }
            }

            return false;
        }

        function boardFull() {
            return board.every(cell => cell !== "");
        }

        function restartGame() {
            board = ["", "", "", "", "", "", "", "", ""];
            player = "X";
            gameOver = false;

            updateBoard();

            document.getElementById("status").textContent =
                "Player X's turn";
        }
    </script>

</body>
</html>
